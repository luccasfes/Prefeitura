<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard — GovDocs</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="mobile-topbar">GovDocs</div>

  <aside class="sidebar">
    <h1>GovDocs</h1>
    <nav>
      <a href="index.html" class="active">📊 Dashboard</a>
      <a href="contratos.html">📄 Contratos</a>
      <a href="projetos.html">🏗️ Projetos</a>
      <a href="tarefas.html">✅ Tarefas</a>
      <a href="configuracoes.html">⚙️ Configurações</a>
      <a href="#" onclick="fazerLogout()" style="color: var(--danger); margin-top: 20px;">🚪 Sair</a>
    </nav>
  </aside>

  <main class="main">
    <header>
      <div>
        <h2>Painel Geral</h2>
        <p>Visão completa do município</p>
      </div>
    </header>

    <div class="grid">
      <!-- Aqui vão os 3 cards exatos que você mandou (Contratos, Projetos, Tarefas) -->
      <section class="card">
        <div class="card-head">
          <h3>Contratos a Vencer</h3>
          <span class="count" id="contratos-count">0</span>
        </div>
        <div class="list" id="contratos-list"><div class="list-empty">Carregando...</div></div>
        <button class="btn-add" onclick="abrirModalContrato()">+ Novo contrato</button>
      </section>

      <section class="card">
        <div class="card-head">
          <h3>Projetos</h3>
          <span class="count" id="projetos-count">0</span>
        </div>
        <div class="list" id="projetos-list"><div class="list-empty">Carregando...</div></div>
        <button class="btn-add" onclick="abrirModalProjeto()">+ Novo projeto</button>
      </section>

      <section class="card">
        <div class="card-head">
          <h3>Tarefas</h3>
          <span class="count" id="tarefas-count">0</span>
        </div>
        <div class="list" id="tarefas-list"><div class="list-empty">Carregando...</div></div>
        <div class="add-tarefa">
          <input type="text" id="nova-tarefa-input" placeholder="Nova tarefa...">
          <button class="btn-add" onclick="adicionarTarefa()">+</button>
        </div>
      </section>
    </div>
  </main>

  <!-- MODAL DE CONTRATO -->
  <div class="modal-overlay" id="modal-contrato">
    <div class="modal">
      <h3>Novo Contrato</h3>
      <div class="field"><label>Título / Objeto</label><input type="text" id="c-titulo"></div>
      <div class="field"><label>Órgão / Secretaria</label><input type="text" id="c-orgao"></div>
      <div class="field"><label>Nº do Contrato</label><input type="text" id="c-numero"></div>
      <div class="field">
        <label>Esfera</label>
        <select id="c-esfera"><option value="Federal">Federal</option><option value="Estadual">Estadual</option><option value="Municipal" selected>Municipal</option></select>
      </div>
      <div class="field"><label>Fornecedor</label><input type="text" id="c-fornecedor"></div>
      <div class="field"><label>Data de Vencimento</label><input type="date" id="c-vencimento"></div>
      <div class="field"><label>Observações</label><textarea id="c-obs" rows="2"></textarea></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="fecharModal('modal-contrato')">Cancelar</button>
        <button class="btn-primary" onclick="salvarContrato()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE PROJETO -->
  <div class="modal-overlay" id="modal-projeto">
    <div class="modal">
      <h3>Novo Projeto</h3>
      <div class="field"><label>Título</label><input type="text" id="p-titulo"></div>
      <div class="field"><label>Descrição</label><textarea id="p-descricao" rows="2"></textarea></div>
      <div class="field"><label>Responsável</label><input type="text" id="p-responsavel"></div>
      <div class="field"><label>Próxima Ação</label><input type="text" id="p-proxima-acao"></div>
      <div class="field"><label>Prazo da Próxima Ação</label><input type="date" id="p-prazo"></div>
      <div class="field">
        <label>Prioridade</label>
        <select id="p-prioridade"><option value="Alta">Alta</option><option value="Média" selected>Média</option><option value="Baixa">Baixa</option></select>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="fecharModal('modal-projeto')">Cancelar</button>
        <button class="btn-primary" onclick="salvarProjeto()">Salvar</button>
      </div>
    </div>
  </div>

  
  <script type="module" src="./js/script.js"></script>
</body>
</html>
