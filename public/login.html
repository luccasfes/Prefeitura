<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login — GovDocs</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body style="align-items: center; justify-content: center; background: var(--sidebar-bg);">

  <div class="card" style="width: 100%; max-width: 400px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
    <h1 style="text-align: center; color: var(--primary); margin-bottom: 24px;">GovDocs</h1>
    <div class="field">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="admin@prefeitura.gov.br">
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="••••••••">
    </div>
    <button class="btn-primary" onclick="fazerLogin()" style="width: 100%; margin-top: 16px;">Entrar no Sistema</button>
  </div>

  <script type="module" src="./js/script.js"></script>
</body>
</html>
