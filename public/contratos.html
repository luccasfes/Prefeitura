<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contratos — GovDocs</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="mobile-topbar">GovDocs</div>

  <aside class="sidebar">
    <h1>GovDocs</h1>
    <nav>
      <a href="index.html">📊 Dashboard</a>
      <a href="contratos.html" class="active">📄 Contratos</a>
      <a href="projetos.html">🏗️ Projetos</a>
      <a href="tarefas.html">✅ Tarefas</a>
      <a href="configuracoes.html">⚙️ Configurações</a>
      <a href="#" onclick="fazerLogout()" style="color: var(--danger); margin-top: 20px;">🚪 Sair</a>
    </nav>
  </aside>

  <main class="main">
    <header>
      <div>
        <h2>Gestão de Contratos</h2>
        <p>Acompanhamento de vigências e fornecedores</p>
      </div>
    </header>

    <section class="card" style="max-width: 800px;">
      <div class="card-head">
        <h3>Todos os Contratos</h3>
        <span class="count" id="contratos-count">0</span>
      </div>
      <div class="list" id="contratos-list" style="max-height: 600px;">
        <div class="list-empty">Carregando contratos...</div>
      </div>
      <button class="btn-add" onclick="abrirModalContrato()">+ Novo contrato</button>
    </section>
  </main>

  <!-- MODAL DE CONTRATO (Cole exatamente o modal-contrato do seu index aqui) -->
  <div class="modal-overlay" id="modal-contrato">
    <div class="modal">
      <h3>Novo Contrato</h3>
      <div class="field"><label>Título / Objeto</label><input type="text" id="c-titulo"></div>
      <div class="field"><label>Órgão / Secretaria</label><input type="text" id="c-orgao"></div>
      <div class="field"><label>Nº do Contrato</label><input type="text" id="c-numero"></div>
      <div class="field">
        <label>Esfera</label>
        <select id="c-esfera"><option value="Federal">Federal</option><option value="Estadual">Estadual</option><option value="Municipal" selected>Municipal</option></select>
      </div>
      <div class="field"><label>Fornecedor</label><input type="text" id="c-fornecedor"></div>
      <div class="field"><label>Data de Vencimento</label><input type="date" id="c-vencimento"></div>
      <div class="field"><label>Observações</label><textarea id="c-obs" rows="2"></textarea></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="fecharModal('modal-contrato')">Cancelar</button>
        <button class="btn-primary" onclick="salvarContrato()">Salvar</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/script.js"></script>
</body>
</html>
