<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contratos - GovDocs</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#10233f">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <div class="mobile-topbar">GovDocs</div>

  <aside class="sidebar">
    <h1>GovDocs</h1>
    <nav>
      <a href="index.html">📊 Dashboard</a>
      <a href="contratos.html" class="active">📄 Contratos</a>
      <a href="projetos.html">🏗️ Projetos</a>
      <a href="tarefas.html">✅ Tarefas</a>
      <a href="configuracoes.html">⚙️ Configurações</a>
      <a href="#" onclick="fazerLogout()" style="color: var(--danger); margin-top: 20px;">🚪 Sair</a>
    </nav>
  </aside>

  <main class="main">
    <header>
      <div>
        <h2>Gestão de Contratos</h2>
        <p>Acompanhamento de vigências e emendas</p>
      </div>
      <button class="btn-add" onclick="abrirModalContrato()">+ Novo contrato</button>
    </header>

    <section class="card" style="min-height: 70vh;">
      <div class="card-head">
        <h3>Lista de Contratos</h3>
        <span class="count" id="contratos-count">0</span>
      </div>
      <div class="list" id="contratos-list" style="max-height: 100%;">
        <div class="list-empty">Carregando contratos...</div>
      </div>
    </section>
  </main>

  <!-- MODAL: NOVO CONTRATO -->
  <div class="modal-overlay" id="modal-contrato">
    <div class="modal">
      <h3>Contrato</h3>
      <div class="field">
        <label>Título / Objeto</label>
        <input type="text" id="c-titulo" placeholder="Ex: Fornecimento de merenda escolar">
      </div>
      <div class="field">
        <label>Órgão / Secretaria</label>
        <input type="text" id="c-orgao" placeholder="Ex: Secretaria de Educação">
      </div>
      <div class="field">
        <label>Nº do Contrato</label>
        <input type="text" id="c-numero" placeholder="Ex: 045/2026">
      </div>
      <div class="field">
        <label>Esfera</label>
        <select id="c-esfera">
          <option value="Federal">Federal</option>
          <option value="Estadual">Estadual</option>
          <option value="Municipal" selected>Municipal</option>
        </select>
      </div>
      <div class="field">
        <label>Fornecedor</label>
        <input type="text" id="c-fornecedor" placeholder="Ex: Empresa XYZ Ltda">
      </div>
      <div class="field">
        <label>Data de Vencimento</label>
        <input type="date" id="c-vencimento">
      </div>
      <div class="field">
        <label>Observações</label>
        <textarea id="c-obs" rows="2"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="fecharModal('modal-contrato')">Cancelar</button>
        <button class="btn-primary" onclick="salvarContrato()">Salvar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, auth } from "../firebase-config.js";
    import { collection, query, orderBy, onSnapshot, addDoc, updateDoc, deleteDoc, doc, Timestamp, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    window.db = db;
    window.contratosCache = {};
    let idContratoEdicao = null;

    window.fazerLogout = async () => await signOut(auth);

    /* HELPERS */
    function diasRestantes(timestamp) {
      if (!timestamp) return null;
      const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      const data = timestamp.toDate(); data.setHours(0, 0, 0, 0);
      return Math.round((data - hoje) / (1000 * 60 * 60 * 24));
    }
    function formatarData(timestamp) {
      if (!timestamp) return "-";
      return timestamp.toDate().toLocaleDateString("pt-BR");
    }
    function formatToDateInput(timestamp) {
      if (!timestamp) return "";
      const date = timestamp.toDate();
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }
    function badgePorDias(dias) {
      if (dias === null) return { classe: "success", texto: "Sem prazo" };
      if (dias < 0) return { classe: "danger", texto: `Atrasado há ${Math.abs(dias)} dia(s)` };
      if (dias <= 7) return { classe: "warning", texto: dias === 0 ? "Vence hoje" : `Vence em ${dias} dia(s)` };
      return { classe: "success", texto: `Vence em ${dias} dia(s)` };
    }
    function escapeHtml(str) {
      const div = document.createElement("div"); div.textContent = str ?? ""; return div.innerHTML;
    }

    /* LÓGICA DE CONTRATOS */
    const contratosRef = query(collection(db, "contratos"), orderBy("data_vencimento", "asc"));

    onSnapshot(contratosRef, (snap) => {
      const list = document.getElementById("contratos-list");
      document.getElementById("contratos-count").textContent = snap.size;
      window.contratosCache = {};

      if (snap.empty) {
        list.innerHTML = '<div class="list-empty">Nenhum contrato cadastrado.</div>';
        return;
      }

      list.innerHTML = "";
      snap.forEach((docSnap) => {
        const c = docSnap.data();
        window.contratosCache[docSnap.id] = c;
        const dias = diasRestantes(c.data_vencimento);
        const badge = badgePorDias(dias);

        const el = document.createElement("div");
        el.className = "item";
        el.innerHTML = `
          <div style="position: absolute; top: 8px; right: 8px; display: flex; gap: 4px;">
            <button class="del-btn" style="position: static;" onclick="editarContrato('${docSnap.id}')">✏️</button>
            <button class="del-btn" style="position: static;" onclick="excluirContrato('${docSnap.id}')">✕</button>
          </div>
          <div class="item-title">${escapeHtml(c.titulo)}</div>
          <div class="item-sub">${escapeHtml(c.orgao || "")} ${c.numero ? "· nº " + escapeHtml(c.numero) : ""}</div>
          <div class="item-sub">Vencimento: ${formatarData(c.data_vencimento)}</div>
          <div class="item-sub" style="margin-top: 6px; font-style: italic;">${escapeHtml(c.observacoes || "")}</div>
          <span class="badge ${badge.classe}">${badge.texto}</span>
        `;
        list.appendChild(el);
      });
    });

    window.abrirModalContrato = () => {
      idContratoEdicao = null;
      document.querySelectorAll("#modal-contrato input, #modal-contrato textarea").forEach(i => i.value = "");
      document.getElementById("c-esfera").value = "Municipal";
      document.getElementById("modal-contrato").classList.add("open");
    };

    window.editarContrato = (id) => {
      idContratoEdicao = id;
      const c = window.contratosCache[id];
      document.getElementById("c-titulo").value = c.titulo || "";
      document.getElementById("c-orgao").value = c.orgao || "";
      document.getElementById("c-numero").value = c.numero || "";
      document.getElementById("c-esfera").value = c.esfera || "Municipal";
      document.getElementById("c-fornecedor").value = c.fornecedor || "";
      document.getElementById("c-obs").value = c.observacoes || "";
      document.getElementById("c-vencimento").value = formatToDateInput(c.data_vencimento);
      document.getElementById("modal-contrato").classList.add("open");
    };

    window.salvarContrato = async () => {
      const titulo = document.getElementById("c-titulo").value.trim();
      const vencimentoStr = document.getElementById("c-vencimento").value;

      if (!titulo || !vencimentoStr) { 
        alert("Preencha ao menos o título e a data de vencimento."); 
        return; 
      }

      // 1. Prepara os dados
      const dadosParaSalvar = {
        titulo,
        orgao: document.getElementById("c-orgao").value.trim(),
        numero: document.getElementById("c-numero").value.trim(),
        esfera: document.getElementById("c-esfera").value,
        fornecedor: document.getElementById("c-fornecedor").value.trim(),
        data_vencimento: Timestamp.fromDate(new Date(vencimentoStr + "T00:00:00")),
        observacoes: document.getElementById("c-obs").value.trim()
      };

      const eraEdicao = !!idContratoEdicao;
      const idAtual = idContratoEdicao;

      // 2. FECHA E LIMPA O MODAL IMEDIATAMENTE (Sensação de rapidez máxima)
      document.getElementById("modal-contrato").classList.remove("open");
      document.querySelectorAll("#modal-contrato input, #modal-contrato textarea").forEach(i => i.value = "");
      document.getElementById("c-esfera").value = "Municipal";
      idContratoEdicao = null;

      // 3. Envia os dados para o Firebase em segundo plano
      try {
        if (eraEdicao) {
          await updateDoc(doc(db, "contratos", idAtual), dadosParaSalvar);
        } else {
          dadosParaSalvar.criadoEm = serverTimestamp();
          await addDoc(collection(db, "contratos"), dadosParaSalvar);
        }
      } catch (error) {
        console.error("Erro ao guardar contrato no Firebase:", error);
        alert("Ocorreu um erro ao gravar os dados. Verifica a tua ligação ou as permissões do Firebase.");
      }
    };

    window.excluirContrato = async (id) => {
      if (confirm("Excluir este contrato?")) await deleteDoc(doc(db, "contratos", id));
    };

    window.fecharModal = (id) => document.getElementById(id).classList.remove("open");
  </script>
</body>
</html>
