<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tarefas — GovDocs</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="mobile-topbar">GovDocs</div>

  <aside class="sidebar">
    <h1>GovDocs</h1>
    <nav>
      <a href="index.html">📊 Dashboard</a>
      <a href="contratos.html">📄 Contratos</a>
      <a href="projetos.html">🏗️ Projetos</a>
      <a href="tarefas.html" class="active">✅ Tarefas</a>
      <a href="configuracoes.html">⚙️ Configurações</a>
      <a href="#" onclick="fazerLogout()" style="color: var(--danger); margin-top: 20px;">🚪 Sair</a>
    </nav>
  </aside>

  <main class="main">
    <header>
      <div>
        <h2>Tarefas Diárias</h2>
        <p>Checklist e pendências rápidas</p>
      </div>
    </header>

    <section class="card" style="max-width: 600px;">
      <div class="card-head">
        <h3>Checklist</h3>
        <span class="count" id="tarefas-count">0</span>
      </div>
      <div class="list" id="tarefas-list" style="max-height: 600px;">
        <div class="list-empty">Carregando tarefas...</div>
      </div>
      <div class="add-tarefa">
        <input type="text" id="nova-tarefa-input" placeholder="Nova tarefa...">
        <button class="btn-add" onclick="adicionarTarefa()">+</button>
      </div>
    </section>
  </main>

  <script type="module" src="./js/script.js"></script>
</body>
</html>
